<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayas Kabya Kanan</title>
  <link rel="stylesheet" href="kabyakanan.css">
  <link rel="stylesheet" href="../advanced-theme.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <img src="../IMAGES/Prayas/logo.jpg" alt="Prayas Logo">
        <span>Prayas Kabya Kanan</span>
      </div>
      <a href="../index.html">Home</a>
    </header>

    <main class="kabya-page">
      <section class="kabya-hero">
        <div>
          <p class="kicker">Literature, Recitation, Expression</p>
          <h1>Kabya Kanan Fee Structure</h1>
          <p>Select a class to view the monthly fee loaded from the published Google Sheet.</p>
        </div>
      </section>

      <section class="fee-panel" aria-labelledby="fee-title">
        <div class="panel-header">
          <div>
            <h2 id="fee-title">Monthly Fee Details</h2>
            <p>Class and fee data is loaded directly from the live sheet.</p>
          </div>
          <div id="sheetStatus" class="sheet-status" role="status" aria-live="polite">
            Loading sheet...
          </div>
        </div>

        <div class="fee-controls">
          <div class="field-group">
            <label for="classSelect">Select Class</label>
            <select id="classSelect" disabled>
              <option value="">Loading classes...</option>
            </select>
          </div>
        </div>

        <div id="amountCard" class="amount-card" hidden>
          <p id="selectionSummary"></p>
          <strong id="feeAmount"></strong>
          <button id="payButton" class="pay-button" type="button" hidden>
            Proceed to Payment
          </button>
        </div>

        <div class="sheet-card">
          <h2>Google Sheet View</h2>
          <div id="sheetTable" class="sheet-table-container" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="kabyakanan.js"></script>
  <script src="../responsive-site.js"></script>
</body>
</html>
